<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PartnerFinder AI - Login</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-background": "#0b1c30",
            "on-surface-variant": "#4a4455",
            "on-tertiary": "#ffffff",
            "secondary-fixed": "#d8e2ff",

            "on-primary-fixed": "#25005a",

            "primary-container": "#7c3aed",
            "on-primary-container": "#ede0ff",
            "on-error": "#ffffff",
            "surface-tint": "#732ee4",
            "surface-container-lowest": "#ffffff",
            "inverse-primary": "#d2bbff",
            "surface-variant": "#d3e4fe",
            "surface-container-low": "#eff4ff",
            "surface-container-high": "#dce9ff",
            "outline": "#7b7487",
            "surface-bright": "#f8f9ff",
            "on-secondary": "#ffffff",
            "surface-container": "#e5eeff",
            "on-tertiary-container": "#dee5ff",
            "primary": "#630ed4",
            "error-container": "#ffdad6",
            "on-surface": "#0b1c30",
            "secondary-container": "#2170e4",
            "secondary-fixed-dim": "#adc6ff",
            "primary-fixed": "#eaddff",
            "inverse-surface": "#213145",
            "on-secondary-container": "#fefcff",
            "tertiary-container": "#5e667d",
            "inverse-on-surface": "#eaf1ff",
            "error": "#ba1a1a",
            "tertiary-fixed": "#dae2fd",
            "on-primary": "#ffffff",
            "primary-fixed-dim": "#d2bbff",
            "on-secondary-fixed": "#001a42",
            "secondary": "#0058be",
            "surface": "#f8f9ff",
            "on-primary-fixed-variant": "#5a00c6",
            "surface-container-highest": "#d3e4fe",
            "outline-variant": "#ccc3d8",
            "tertiary": "#474e64",
            "on-secondary-fixed-variant": "#004395",
            "tertiary-fixed-dim": "#bec6e0",
            "background": "#f8f9ff",
            "surface-dim": "#cbdbf5"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "space-sm": "0.5rem",
            "space-xs": "0.25rem",
            "space-lg": "1.25rem",
            "space-xl": "1.5rem",
            "space-md": "0.75rem",
            "gutter": "1.5rem",
            "margin": "2rem"
          },
          "fontFamily": {
            "body-md": ["Inter"],
            "headline-md": ["Inter"],
            "label-md": ["Inter"],
            "headline-sm": ["Inter"],
            "headline-lg": ["Inter"],
            "body-sm": ["Inter"],
            "body-lg": ["Inter"],
            "code-sm": ["JetBrains Mono"],
            "display-lg": ["Inter"],
            "label-xs": ["Inter"],
            "label-sm": ["Inter"]
          },
          "fontSize": {
            "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
            "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }],
            "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
            "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
            "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
            "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "code-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
            "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.025em", "fontWeight": "700" }],
            "label-xs": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "600" }],
            "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }]
          }
        }

  </script>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-4 antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Centered Login Card Container (Approx 420px wide, 12px radius, soft border, level 1 elevation) -->
<main class="w-full max-w-[420px] bg-surface-container-lowest border border-surface-container rounded-xl p-8 shadow-[0_1px_3px_0_rgba(15,23,42,0.05),0_1px_2px_-1px_rgba(15,23,42,0.03)] flex flex-col">
<!-- Top Branding & Headers -->
<header class="flex flex-col items-center text-center">
<!-- Product Logo & Name -->
<div class="flex items-center gap-2 mb-6">
<div class="w-9 h-9 rounded-lg bg-gradient-to-br from-primary-container to-secondary-container flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="hub">hub</span>
</div>
<span class="text-headline-md font-headline-md text-on-surface">PartnerFinder AI</span>
</div>
<!-- Heading -->
<h1 class="text-headline-lg font-headline-lg text-on-surface">Welcome Back</h1>
<!-- Subtitle -->
<p class="text-body-md font-body-md text-tertiary mt-1">Login to continue</p>
</header>
<!-- Login Form -->
<form action="#" class="mt-8 flex flex-col gap-4" method="POST" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="text-label-sm font-label-sm text-on-surface" for="email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-tertiary text-[18px] pointer-events-none" data-icon="mail">mail</span>
<input class="w-full h-11 pl-10 pr-3.5 bg-surface-container-lowest border border-surface-container rounded-lg text-body-md font-body-md text-on-surface placeholder:text-tertiary-fixed-variant/60 focus:border-primary-container focus:ring-2 focus:ring-primary-container/15 focus:outline-none transition-all duration-150" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="text-label-sm font-label-sm text-on-surface" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-tertiary text-[18px] pointer-events-none" data-icon="lock">lock</span>
<input class="w-full h-11 pl-10 pr-10 bg-surface-container-lowest border border-surface-container rounded-lg text-body-md font-body-md text-on-surface placeholder:text-tertiary-fixed-variant/60 focus:border-primary-container focus:ring-2 focus:ring-primary-container/15 focus:outline-none transition-all duration-150" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-tertiary hover:text-on-surface flex items-center justify-center p-0.5 focus:outline-none" id="togglePassword" onclick="const p = document.getElementById('password'); const isPass = p.type === 'password'; p.type = isPass ? 'text' : 'password'; this.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember me & Forgot Password Row -->
<div class="flex items-center justify-between mt-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input class="w-[18px] h-[18px] rounded border-surface-container text-primary-container focus:ring-primary-container/20 focus:ring-offset-0 cursor-pointer" name="remember" type="checkbox"/>
<span class="text-label-sm font-label-sm text-on-surface">Remember me</span>
</label>
<a class="text-label-sm font-label-sm text-primary-container hover:text-primary transition-colors duration-150" href="#">Forgot Password?</a>
</div>
<!-- Purple Gradient Login Button -->
<button class="w-full h-[42px] mt-2 rounded-lg bg-gradient-to-r from-[#7C3AED] to-[#3B82F6] hover:brightness-105 active:scale-[0.99] text-on-primary text-label-md font-label-md shadow-[0_1px_2px_rgba(0,0,0,0.05)] hover:shadow-[0_4px_14px_0_rgba(124,58,237,0.35)] transition-all duration-150 flex items-center justify-center cursor-pointer" type="submit">
        Login
      </button>
</form>
<!-- Soft Subtle OR Divider -->
<div class="relative my-6 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-container"></div>
</div>
<div class="relative bg-surface-container-lowest px-3">
<span class="text-label-xs font-label-xs text-tertiary tracking-wider">OR</span>
</div>
</div>
<!-- Social Login Buttons Cluster -->
<div class="flex flex-col gap-2.5">
<!-- Continue with Google -->
<button class="w-full h-[42px] bg-surface-container-lowest border border-surface-container hover:bg-surface hover:border-surface-dim active:scale-[0.99] rounded-lg text-on-surface text-label-md font-label-md flex items-center justify-center gap-3 transition-all duration-150 cursor-pointer" type="button">
<svg aria-hidden="true" class="w-4 h-4 shrink-0" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
<!-- Continue with Microsoft -->
<button class="w-full h-[42px] bg-surface-container-lowest border border-surface-container hover:bg-surface hover:border-surface-dim active:scale-[0.99] rounded-lg text-on-surface text-label-md font-label-md flex items-center justify-center gap-3 transition-all duration-150 cursor-pointer" type="button">
<svg aria-hidden="true" class="w-4 h-4 shrink-0" viewbox="0 0 23 23">
<path d="M1 1h10v10H1z" fill="#f35325"></path>
<path d="M12 1h10v10H12z" fill="#81bc06"></path>
<path d="M1 12h10v10H1z" fill="#05a6f0"></path>
<path d="M12 12h10v10H12z" fill="#ffba08"></path>
</svg>
<span>Continue with Microsoft</span>
</button>
</div>
<!-- Bottom Registration Link -->
<footer class="mt-8 text-center">
<p class="text-body-sm font-body-sm text-tertiary">
        Don’t have an account? 
        <a class="text-label-sm font-label-sm text-primary-container hover:text-primary ml-1 transition-colors duration-150" href="#">Create Account</a>
</p>
</footer>
</main>
</body></html>
