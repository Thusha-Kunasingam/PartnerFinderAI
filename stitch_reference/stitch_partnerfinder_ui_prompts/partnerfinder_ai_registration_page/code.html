<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PartnerFinder AI - Register</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-container-highest": "#d3e4fe",
            "tertiary": "#474e64",
            "inverse-primary": "#d2bbff",
            "on-primary": "#ffffff",
            "on-primary-fixed": "#25005a",
            "outline": "#7b7487",
            "on-secondary": "#ffffff",
            "primary-container": "#7c3aed",
            "primary-fixed-dim": "#d2bbff",
            "background": "#f8f9ff",
            "inverse-on-surface": "#eaf1ff",
            "on-secondary-fixed-variant": "#004395",
            "secondary": "#0058be",
            "tertiary-fixed-dim": "#bec6e0",
            "on-primary-fixed-variant": "#5a00c6",
            "error-container": "#ffdad6",
            "surface-variant": "#d3e4fe",
            "error": "#ba1a1a",
            "surface-container-low": "#eff4ff",
            "surface-dim": "#cbdbf5",
            "outline-variant": "#ccc3d8",
            "surface-container-lowest": "#ffffff",
            "on-error-container": "#93000a",
            "on-secondary-container": "#fefcff",
            "on-secondary-fixed": "#001a42",
            "secondary-fixed": "#d8e2ff",
            "surface-container-high": "#dce9ff",
            "primary-fixed": "#eaddff",
            "surface-container": "#e5eeff",
            "on-error": "#ffffff",
            "surface-tint": "#732ee4",
            "secondary-fixed-dim": "#adc6ff",
            "tertiary-container": "#5e667d",
            "on-tertiary-fixed": "#131b2e",
            "on-tertiary-fixed-variant": "#3f465c",
            "on-tertiary": "#ffffff",
            "surface": "#f8f9ff",
            "on-primary-container": "#ede0ff",
            "on-background": "#0b1c30",
            "on-surface-variant": "#4a4455",
            "on-tertiary-container": "#dee5ff",
            "surface-bright": "#f8f9ff",
            "secondary-container": "#2170e4",
            "on-surface": "#0b1c30",
            "tertiary-fixed": "#dae2fd",
            "primary": "#630ed4",
            "inverse-surface": "#213145"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "space-md": "0.75rem",
            "space-sm": "0.5rem",
            "gutter": "1.5rem",
            "space-xs": "0.25rem",
            "space-xl": "1.5rem",
            "margin": "2rem",
            "space-lg": "1.25rem"
          },
          "fontFamily": {
            "label-md": ["Inter"],
            "label-sm": ["Inter"],
            "headline-md": ["Inter"],
            "headline-lg": ["Inter"],
            "body-sm": ["Inter"],
            "body-lg": ["Inter"],
            "headline-sm": ["Inter"],
            "body-md": ["Inter"],
            "label-xs": ["Inter"],
            "display-lg": ["Inter"],
            "code-sm": ["JetBrains Mono"]
          },
          "fontSize": {

            "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
            "label-xs": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "600" }],
            "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.025em", "fontWeight": "700" }],
            "code-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }]
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
    .btn-gradient {
      background: linear-gradient(135deg, #7C3AED 0%, #3B82F6 100%);
    }
    .btn-gradient:hover {
      filter: brightness(108%);
      box-shadow: 0 4px 14px 0 rgba(124, 58, 237, 0.35);
    }
  </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-6 selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Registration Card Container (approx 420px wide) -->
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-[12px] border border-[#E2E8F0] shadow-[0_1px_3px_0_rgba(15,23,42,0.05),0_1px_2px_-1px_rgba(15,23,42,0.03)] p-8">
<!-- Top of Card: Logo, Heading, Subtitle -->
<div class="flex flex-col items-center text-center mb-7">
<div class="flex items-center gap-2 mb-4">
<div class="w-8 h-8 rounded-lg bg-on-background flex items-center justify-center text-surface-container-lowest">
<span class="material-symbols-outlined text-[20px]" data-icon="hub">hub</span>
</div>
<span class="text-headline-md font-headline-md font-bold text-on-background tracking-tight">PartnerFinder AI</span>
</div>
<h1 class="text-headline-lg font-headline-lg font-bold text-on-background tracking-tight mb-1.5">Create Your Account</h1>
<p class="text-body-md font-body-md text-tertiary">Join and start finding your perfect partner.</p>
</div>
<!-- Form Section -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- 1. Full Name -->
<div class="space-y-1.5">
<label class="block text-label-md font-label-md text-on-surface" for="full_name">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-[20px] text-[#94A3B8] pointer-events-none" data-icon="person">person</span>
<input class="w-full h-[46px] pl-10 pr-4 bg-surface-container-lowest border border-[#E2E8F0] rounded-[10px] text-body-md font-body-md text-on-surface placeholder-[#94A3B8] focus:border-primary-container focus:ring-2 focus:ring-primary-container/15 focus:outline-none transition-all duration-150" id="full_name" name="full_name" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- 2. Email -->
<div class="space-y-1.5">
<label class="block text-label-md font-label-md text-on-surface" for="email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-[20px] text-[#94A3B8] pointer-events-none" data-icon="mail">mail</span>
<input class="w-full h-[46px] pl-10 pr-4 bg-surface-container-lowest border border-[#E2E8F0] rounded-[10px] text-body-md font-body-md text-on-surface placeholder-[#94A3B8] focus:border-primary-container focus:ring-2 focus:ring-primary-container/15 focus:outline-none transition-all duration-150" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- 3. Password -->
<div class="space-y-1.5">
<label class="block text-label-md font-label-md text-on-surface" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-[20px] text-[#94A3B8] pointer-events-none" data-icon="lock">lock</span>
<input class="w-full h-[46px] pl-10 pr-10 bg-surface-container-lowest border border-[#E2E8F0] rounded-[10px] text-body-md font-body-md text-on-surface placeholder-[#94A3B8] focus:border-primary-container focus:ring-2 focus:ring-primary-container/15 focus:outline-none transition-all duration-150" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 text-[#94A3B8] hover:text-on-surface focus:outline-none flex items-center justify-center transition-colors duration-150" onclick="const p = document.getElementById('password'); const isPass = p.type === 'password'; p.type = isPass ? 'text' : 'password'; this.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- 4. Confirm Password -->
<div class="space-y-1.5">
<label class="block text-label-md font-label-md text-on-surface" for="confirm_password">Confirm Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-[20px] text-[#94A3B8] pointer-events-none" data-icon="lock">lock</span>
<input class="w-full h-[46px] pl-10 pr-10 bg-surface-container-lowest border border-[#E2E8F0] rounded-[10px] text-body-md font-body-md text-on-surface placeholder-[#94A3B8] focus:border-primary-container focus:ring-2 focus:ring-primary-container/15 focus:outline-none transition-all duration-150" id="confirm_password" name="confirm_password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle confirm password visibility" class="absolute right-3.5 text-[#94A3B8] hover:text-on-surface focus:outline-none flex items-center justify-center transition-colors duration-150" onclick="const cp = document.getElementById('confirm_password'); const isPass = cp.type === 'password'; cp.type = isPass ? 'text' : 'password'; this.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full h-[44px] btn-gradient text-on-primary font-label-md text-label-md rounded-[8px] flex items-center justify-center transition-all duration-150 active:scale-[0.98] cursor-pointer" type="submit">
          Create Account
        </button>
</div>
</form>
<!-- Bottom Link -->
<div class="mt-6 text-center text-body-md font-body-md text-tertiary">
      Already have an account? 
      <a class="text-primary-container font-label-md text-label-md hover:underline ml-1" href="#">Login</a>
</div>
</main>
</body></html>
