name: partnerfinder_mobile
description: "PartnerFinder AI Mobile Application — AI-Powered Project Partner Matching"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Navigation & Routing
  go_router: ^14.0.0
  
  # State Management
  provider: ^6.1.2
  
  # Typography & Icons
  google_fonts: ^6.2.1
  
  # Local Storage & Utilities
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
